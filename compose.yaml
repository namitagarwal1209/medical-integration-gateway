
services:

  med_gateway:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      EMR_URL: http://emr:8001
      ANALYSIS_SERVICE_URL: http://analysis_service:8002
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: med_gateway
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
    depends_on:
      - emr
      - analysis_service
      - orthanc

  emr:
    build: .
    command: uvicorn emr:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  analysis_service:
    build: .
    command: uvicorn analysis_service:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"

  orthanc:
    image: jodogne/orthanc
    ports:
      - "8042:8042"
      - "4242:4242"
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
